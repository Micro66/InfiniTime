[platformio]
default_envs = waveshare-175
src_dir = ../..

[env:waveshare-175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_build.flash_size = 32MB
board_upload.maximum_size = 6291456
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/build.py
lib_extra_dirs = vendor/waveshare/examples/arduino/libraries
lib_ignore = lvgl
lib_ldf_mode = chain+
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++20
    -D PINETIME_ESP32=1
    -D PINETIME_ROUND_DISPLAY=1
    -D LV_HOR_RES_MAX=466
    -D LV_VER_RES_MAX=466
    -D LV_DPI=160
    -D LV_COLOR_16_SWAP=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -D XPOWERS_CHIP_AXP2101
    -I include
    -I generated
    -I ../../src
    -I ../../src/libs
    -I ../../src/displayapp
build_src_filter =
    -<*>
    +<ports/esp32/src/>
    +<ports/esp32/generated/*.c>
    +<src/libs/lvgl/src/>
    +<src/libs/littlefs/lfs.c>
    +<src/libs/littlefs/lfs_util.c>
    +<src/displayapp/InfiniTimeTheme.cpp>
    +<src/displayapp/screens/Screen.cpp>
    +<src/displayapp/screens/WatchFaceAnalog.cpp>
    +<src/displayapp/screens/BatteryIcon.cpp>
    +<src/displayapp/screens/BleIcon.cpp>
    +<src/displayapp/screens/NotificationIcon.cpp>
    +<src/displayapp/screens/Calculator.cpp>
    +<src/displayapp/screens/StopWatch.cpp>
    +<src/displayapp/screens/Twos.cpp>
    +<src/components/settings/Settings.cpp>
    +<src/components/fs/FS.cpp>
    +<src/components/ble/BleController.cpp>
    +<src/components/ble/NotificationManager.cpp>
    +<src/components/stopwatch/StopWatchController.cpp>
    +<src/systemtask/WakeLock.cpp>
