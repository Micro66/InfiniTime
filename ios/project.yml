name: BadgeStudio
options:
  bundleIdPrefix: com.micro66
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  BadgeStudio:
    type: application
    platform: iOS
    sources: [BadgeStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.micro66.BadgeStudio
        INFOPLIST_KEY_CFBundleDisplayName: 吧唧
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BadgeStudio/Info.plist
      properties:
        CFBundleDisplayName: 吧唧
        NSBluetoothAlwaysUsageDescription: 通过蓝牙连接你的吧唧，同步时间、切换表盘和传输照片。
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  BadgeStudio:
    build:
      targets:
        BadgeStudio: all
